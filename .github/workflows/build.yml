name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Descomprimir y compilar
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "Compilando $ZIP"
          unzip -q "$ZIP" -d proyecto
          cd proyecto/*/
          gradle assembleDebug --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KilTeef oneplus (build ${{ github.run_number }})
          files: proyecto/*/app/build/outputs/apk/debug/app-debug.apkg/app-debug.apk
