name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Descomprimir y compilar
        run: |
          unzip -q ./*.zip -d proyecto
          cd proyecto/*/
          gradle assembleDebug --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-build${{ github.run_number }}
          name: KilTeef oneplus v1.2 (build ${{ github.run_number }})
          files: proyecto/*/app/build/outputs/apk/debug/app-debug.apk
